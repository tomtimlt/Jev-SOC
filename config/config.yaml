# Configuration de Jev-SOC.
# Les chemins relatifs sont résolus par rapport au dossier de ce fichier (config/).
# Aucun secret ici : la clé Jev est lue dans la variable d'environnement TYPESAFE_API_KEY.

# Backend de décision : mock | jev | laya
backend: mock

# Jeu de questions typées (la version "v2" est déduite du nom de fichier)
questions_file: questions.v2.json

# Recalibration des probabilités par backend (produite par eval/calibrate.py sur la VALIDATION)
calibration_file: calibration.yaml

mock:
  # Optionnel : fichier JSON {cluster_id: {question: réponse}} pour imposer des réponses précises.
  # Sans fichier, le mock renvoie des réponses neutres (0,5, milieu d'échelle).
  fixtures: null

jev:
  model: jev-latest
  timeout_s: 120

# Seuils de la politique de décision (src/jevsoc/policy.py). Valeurs initiales à calibrer
# sur le split de validation, pas des vérités.
policy:
  # En dessous (et priorité basse) : monitor. Échelle CALIBRÉE quand config/calibration.yaml existe
  # pour le backend. 0,15 = choisi sur la validation AIT (eval/calibrate.py) : garde les 3 chaînes
  # de validation, 0/90 bénin au-dessus. Rater une APT coûte plus cher qu'un coup d'œil d'analyste.
  sophisticated_low: 0.15
  sophisticated_high: 0.7       # au-dessus : attaque probable
  # Priorité max pour rester en monitor. 2,0 (réglé sur 3 scénarios synthétiques) envoyait 67 % des
  # bénins AIT en investigate ; 3,0 = plus petite valeur sans bénin en investigate sur la VALIDATION
  # AIT (0/90), toutes les chaînes multi-étapes de validation restant au-dessus de monitor.
  priority_monitor_max: 3.0
  contain_min: 0.7              # seuil de should_contain_now
  escalate_min: 0.7             # seuil de should_escalate_to_ir
  # Garde-fou : contain / escalate seulement si P(attaque) >= sophisticated_high ET au moins
  # action_min_alerts alertes. Mesuré sur la courbe de soupçon : sur UNE alerte, Jev met déjà
  # P(isoler) et P(escalader) à 0,7-0,9, même sur du patching bénin.
  action_min_alerts: 2
  low_confidence_max: 0.5       # marge |2p-1| sur P(attaque) en dessous de laquelle on doute
  # Règle de volume (complément du modèle pour les scans / brute force) : un cluster d'au moins
  # N alertes passe au minimum en investigate. Jamais contain / escalate. Choisi sur la validation
  # par eval/calibrate.py.
  volume_min_alerts: 89        # = plus gros cluster bénin de validation (88) + 1
  exfil_inconsistency_max: 0.3  # étape "exfiltration" mais P(exfiltration non autorisée) sous ce seuil

# Corrélation (jalon 3)
correlation:
  window_minutes: 240
  max_cluster_size: 100000    # au-delà, découpage en tranches ; le sérialiseur regroupe les répétitions,
                              # donc une rafale de scan reste UN cluster au lieu de dizaines de morceaux
  max_gap_minutes: 60         # écart max entre deux alertes partageant une entité pour les relier
  hub_entity_max_ratio: 0.2   # entité vue dans plus de 20 % des HEURES = hub, ne crée pas de lien
  max_timeline_entries: 30    # groupes d'alertes max dans le state envoyé au modèle
  min_alerts: 3
  min_entities: 2
  denylist_file: entity_denylist.yaml
