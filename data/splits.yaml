# Split train / validation / test, fixé par SCÉNARIO et non par fichier :
# toutes les variantes d'un même scénario restent dans le même split (pas de fuite).
#
# État actuel : seulement 3 scénarios de démonstration, tous en "test". Ils ne servent
# qu'à la matrice d'ablation, pas à calibrer. Le vrai split arrive avec le jeu de
# 20 clusters (jalon 2) ; une fois publié, ne plus déplacer un scénario.
attack: test
benign: test
adversarial: test

# AIT-ADS (vraies alertes Wazuh, data/ait/) : split par scénario, fixé.
# validation : sert UNIQUEMENT à choisir les seuils (eval.py, section "seuils choisis sur validation")
# test       : sert à mesurer ; ne jamais régler quoi que ce soit dessus
fox: validation
harrison: validation
wheeler: validation
russellmitchell: test
santos: test
shaw: test
wardbeck: test
wilson: test

# Émulation APT29 (Windows, OTRF) rejouée dans Wazuh (data/apt29/) : TEST UNIQUEMENT.
# Aucun seuil ni aucune calibration n'est réglé dessus : c'est un test hors distribution
# (Windows/Sysmon au lieu de Linux/web, autre attaquant, autres outils).
apt29_day1: test
apt29_day2: test
